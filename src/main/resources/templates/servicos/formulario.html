<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Novo Serviço | LCL Mundo dos Vidros</title>

    <link
        rel="stylesheet"
        th:href="@{/css/style.css}">
</head>

<body>

<aside class="menu-lateral">

    <div class="logo">
        <img
            class="logo-imagem"
            th:src="@{/img/logo-lcl.png}"
            alt="Logo LCL Mundo dos Vidros">
    </div>

    <nav>
        <a th:href="@{/}">Início</a>
        <a th:href="@{/clientes}">Clientes</a>
        <a th:href="@{/servicos}" class="ativo">Serviços</a>
        <a href="#">Financeiro</a>
    </nav>

</aside>

<main class="conteudo">

    <header class="cabecalho">
        <h2>Novo Serviço</h2>
        <p>Cadastre um novo serviço.</p>
    </header>

    <section class="painel painel-formulario">

        <form
            class="formulario"
            th:action="@{/servicos/salvar}"
            th:object="${servico}"
            method="post">
            <input
                type="hidden"
                th:field="*{idServico}">

            <div class="campo">

                <label>Cliente *</label>

                <select
                    th:field="*{cliente}"
                    required>

                    <option value="">
                        Selecione o cliente
                    </option>

                    <option
                        th:each="cliente : ${clientes}"
                        th:value="${cliente.idCliente}"
                        th:text="${cliente.nome}">
                    </option>

                </select>

            </div>

            <div class="campo">

                <label>Tipo de Serviço *</label>

                <select
                    th:field="*{tipoDeServico}"
                    required>

                    <option value="">
                        Selecione o tipo
                    </option>

                    <option
                        th:each="tipo : ${tipos}"
                        th:value="${tipo.idTipo}"
                        th:text="${tipo.tipo}">
                    </option>

                </select>

            </div>

            <div class="campo">

                <label>Status *</label>

                <select
                    th:field="*{statusServico}"
                    required>

                    <option value="Pendente">
                        Pendente
                    </option>

                    <option value="Em andamento">
                        Em andamento
                    </option>

                    <option value="Concluído">
                        Concluído
                    </option>

                </select>

            </div>

            <div class="campo">

                <label>Data do orçamento</label>

                <input
                    type="date"
                    th:field="*{dataOrcamento}">

            </div>

            <div class="campo">

                <label>Data da venda</label>

                <input
                    type="date"
                    th:field="*{dataVenda}">

            </div>

            <div class="campo">

                <label>Data da execução</label>

                <input
                    type="date"
                    th:field="*{dataInstalacao}">

            </div>

            <div class="campo campo-completo">

                <label>Descrição do serviço</label>

                <textarea
                    rows="6"
                    th:field="*{descricao}">
                </textarea>

            </div>

            <div class="campo">

                <label>Observação de pagamento</label>

                <textarea
                    rows="5"
                    th:field="*{observacaoPagamento}">
                </textarea>

            </div>

            <div class="campo">

                <label>Observação de execução</label>

                <textarea
                    rows="5"
                    th:field="*{observacaoExecucao}">
                </textarea>

            </div>

            <div class="campo">

                <label>Valor de custo</label>

                <input
                    type="number"
                    min="0"
                    step="0.01"
                    th:field="*{valorCusto}">

            </div>

            <div class="campo">

                <label>Valor cobrado</label>

                <input
                    type="number"
                    min="0"
                    step="0.01"
                    th:field="*{valorCobrado}">

            </div>

            <div class="acoes-formulario campo-completo">

                <a
                    class="botao botao-secundario"
                    th:href="@{/servicos}">

                    Cancelar

                </a>

                <button
                    class="botao botao-salvar"
                    type="submit">

                    Salvar Serviço

                </button>

            </div>

        </form>

    </section>

</main>

</body>
</html>
